name: Sync upstream

"on":
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge latest upstream release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/make-all/tuya-local.git
          latest_release="$(
            gh api repos/make-all/tuya-local/releases/latest --jq .tag_name
          )"
          git fetch upstream \
            "refs/tags/${latest_release}:refs/tags/${latest_release}"
          git merge --no-edit "${latest_release}"
          git push origin main
